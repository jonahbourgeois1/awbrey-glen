<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awbrey Glen</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 16px/1.4 system-ui, sans-serif; }
  #bar { display: flex; gap: 0.6rem; align-items: center; padding: 0.7rem 1rem; }
  a { color: #9dccff; }
  button { color: #eee; background: #1c2430; border: 1px solid #3d4d66; border-radius: 6px; font: inherit; padding: 0.25rem 0.8rem; cursor: pointer; }
  button.on { background: #2a4a28; border-color: #6d6; }
  button:disabled { opacity: 0.35; cursor: default; }
  #stage { position: relative; height: calc(100% - 3.2rem); background: #000; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; }
  #orthoView { display: none; position: absolute; inset: 0; z-index: 2; overflow: hidden; background: #000; touch-action: none; cursor: grab; }
  #orthoView.dragging { cursor: grabbing; }
  #orthoFit { position: absolute; transform-origin: 0 0; }
  #ortho { display: block; width: 100%; height: 100%; pointer-events: none; }
  #pins { position: absolute; inset: 0; display: none; pointer-events: none; }
  #pins i { position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; border-radius: 50%; box-sizing: border-box; }
  #pins i.dot { background: #fff; border: 2px solid #111; }
  #pins i.x { background: transparent; border: 2px solid #ffe14a; }
  #err { padding: 1.5rem; }
</style>
</head>
<body>
<div id="bar">
  <a href="./">All holes</a>
  <strong id="title">Hole</strong>
  <button id="orthoBtn" type="button">ORTHO</button>
  <button id="dotBtn" type="button" disabled>Dots</button>
  <button id="xBtn" type="button" disabled>X</button>
</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="orthoView">
    <div id="orthoFit">
      <img id="ortho" alt="Orthophoto">
      <div id="pins"></div>
    </div>
  </div>
</div>
<p id="err" hidden></p>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const BASE = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm";
const { GLTFLoader } = await import(BASE + "/loaders/GLTFLoader.js");
const { DRACOLoader } = await import(BASE + "/loaders/DRACOLoader.js");
const { OrbitControls } = await import(BASE + "/controls/OrbitControls.js");

const params = new URLSearchParams(location.search);
const hole = params.get("hole");
const title = document.getElementById("title");
const canvas = document.getElementById("view");
const orthoView = document.getElementById("orthoView");
const orthoFit = document.getElementById("orthoFit");
const img = document.getElementById("ortho");
const pinLayer = document.getElementById("pins");
const err = document.getElementById("err");
const dotBtn = document.getElementById("dotBtn");
const xBtn = document.getElementById("xBtn");

function fail(message) {
  err.hidden = false;
  err.textContent = message;
}

const special = {
  "17-original": ["Hole 17 · original", "holes/17-original/"],
  "17-spray": ["Hole 17 · four videos", "holes/17-spray/"]
};
let label = "";
let folder = "";
if (special[hole]) {
  label = special[hole][0];
  folder = special[hole][1];
} else {
  const n = Number(hole);
  if (!Number.isInteger(n) || n < 1 || n > 18) {
    fail("Open a hole from the list.");
  } else {
    label = n === 17 ? "Hole 17 · sprinklers" : "Hole " + n;
    folder = "holes/" + String(n).padStart(2, "0") + "/";
  }
}
if (label) {
  title.textContent = label;
  document.title = label + " — Awbrey Glen";
  img.src = folder + "ortho.jpg";
  img.alt = label + " orthophoto";
}

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: false,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(1);
renderer.setClearColor(0x111111);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(0.4, -0.6, 1);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const dotGroup = new THREE.Group();
const xGroup = new THREE.Group();
dotGroup.visible = false;
xGroup.visible = false;
scene.add(dotGroup);
scene.add(xGroup);

let frameInfo = null;
let pinData = { dots: [], x: [] };
let pinMode = "";
let showingOrtho = false;
let live = true;
let viewScale = 1;
let panX = 0;
let panY = 0;
let drag = null;
let modelCenter = null;
let modelRoot = null;

function resize() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
window.addEventListener("resize", function () { layoutPins(); placeOrtho(); });

function fitBox() {
  const stage = document.getElementById("stage").getBoundingClientRect();
  const fit = Math.min(stage.width / img.naturalWidth, stage.height / img.naturalHeight);
  const width = img.naturalWidth * fit;
  const height = img.naturalHeight * fit;
  return {
    width: width,
    height: height,
    left: (stage.width - width) / 2,
    top: (stage.height - height) / 2,
    stageWidth: stage.width,
    stageHeight: stage.height
  };
}

function clampPan() {
  if (viewScale <= 1) {
    viewScale = 1;
    panX = 0;
    panY = 0;
    return;
  }
  const box = fitBox();
  const width = box.width * viewScale;
  const height = box.height * viewScale;
  const margin = 48;
  panX = Math.min(box.stageWidth - margin - box.left, Math.max(margin - box.left - width, panX));
  panY = Math.min(box.stageHeight - margin - box.top, Math.max(margin - box.top - height, panY));
}

function placeOrtho() {
  if (!showingOrtho || !img.naturalWidth) return;
  clampPan();
  const box = fitBox();
  orthoFit.style.left = box.left + "px";
  orthoFit.style.top = box.top + "px";
  orthoFit.style.width = box.width + "px";
  orthoFit.style.height = box.height + "px";
  orthoFit.style.transform = "translate(" + panX.toFixed(1) + "px," + panY.toFixed(1) + "px) scale(" + viewScale.toFixed(4) + ")";
}

function layoutPins() {
  if (!showingOrtho || !pinMode || !frameInfo || !img.naturalWidth) {
    pinLayer.style.display = "none";
    return;
  }
  pinLayer.style.display = "block";
  const points = pinData[pinMode] || [];
  const kind = pinMode === "x" ? "x" : "dot";
  const html = [];
  for (let i = 0; i < points.length; i++) {
    const easting = points[i][0];
    const northing = points[i][1];
    const x = (easting - frameInfo.west) / frameInfo.gsdX / frameInfo.w * 100;
    const y = (frameInfo.north - northing) / frameInfo.gsdY / frameInfo.h * 100;
    html.push('<i class="' + kind + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%"></i>');
  }
  pinLayer.innerHTML = html.join("");
}

orthoView.addEventListener("wheel", function (event) {
  if (!showingOrtho || !img.naturalWidth) return;
  event.preventDefault();
  const box = fitBox();
  const rect = orthoView.getBoundingClientRect();
  const cx = event.clientX - rect.left;
  const cy = event.clientY - rect.top;
  const next = Math.min(8, Math.max(1, viewScale * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
  const worldX = (cx - box.left - panX) / viewScale;
  const worldY = (cy - box.top - panY) / viewScale;
  viewScale = next;
  panX = cx - worldX * viewScale - box.left;
  panY = cy - worldY * viewScale - box.top;
  placeOrtho();
}, { passive: false });

orthoView.addEventListener("pointerdown", function (event) {
  if (!showingOrtho || event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY, panX: panX, panY: panY };
  orthoView.setPointerCapture(event.pointerId);
  orthoView.classList.add("dragging");
});
orthoView.addEventListener("pointermove", function (event) {
  if (!drag || event.pointerId !== drag.id) return;
  panX = drag.panX + event.clientX - drag.x;
  panY = drag.panY + event.clientY - drag.y;
  placeOrtho();
});
function endDrag(event) {
  if (!drag || event.pointerId !== drag.id) return;
  drag = null;
  orthoView.classList.remove("dragging");
}
orthoView.addEventListener("pointerup", endDrag);
orthoView.addEventListener("pointercancel", endDrag);
orthoView.addEventListener("dblclick", function () {
  viewScale = 1;
  panX = 0;
  panY = 0;
  placeOrtho();
});

function setPins(mode) {
  if (pinMode === mode) mode = "";
  pinMode = mode;
  dotGroup.visible = mode === "dots";
  xGroup.visible = mode === "x";
  dotBtn.classList.toggle("on", mode === "dots");
  xBtn.classList.toggle("on", mode === "x");
  layoutPins();
}
dotBtn.addEventListener("click", function () { setPins("dots"); });
xBtn.addEventListener("click", function () { setPins("x"); });

function addMarkers(group, points, kind) {
  const material = kind === "x"
    ? new THREE.MeshBasicMaterial({ color: 0xffe14a, depthTest: false })
    : new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
  const geometry = kind === "x"
    ? new THREE.TorusGeometry(1.15, 0.22, 6, 16)
    : new THREE.SphereGeometry(0.7, 8, 6);
  const down = new THREE.Vector3(0, 0, -1);
  const ray = new THREE.Raycaster();
  modelRoot.updateMatrixWorld(true);
  for (let i = 0; i < points.length; i++) {
    const x = points[i][0] - frameInfo.ox - modelCenter.x;
    const y = points[i][1] - frameInfo.oy - modelCenter.y;
    ray.set(new THREE.Vector3(x, y, 80), down);
    const hit = modelRoot ? ray.intersectObject(modelRoot, true)[0] : null;
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, hit ? hit.point.z + 0.5 : 1);
    mesh.frustumCulled = false;
    mesh.renderOrder = 2;
    group.add(mesh);
  }
}

function markersReady() {
  if (!modelCenter || !frameInfo || dotGroup.children.length || xGroup.children.length) return;
  addMarkers(dotGroup, pinData.dots, "dot");
  addMarkers(xGroup, pinData.x, "x");
}

if (folder) {
  fetch(folder + "frame.json").then(function (r) { return r.json(); }).then(function (data) {
    frameInfo = data;
    markersReady();
  }).catch(function () { fail("The photo position did not load."); });
  fetch(folder + "pins.json").then(function (r) { return r.json(); }).then(function (data) {
    pinData = data;
    dotBtn.disabled = !(data.dots && data.dots.length);
    xBtn.disabled = !(data.x && data.x.length);
    markersReady();
  }).catch(function () {});
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.load(folder + "model.glb", function (gltf) {
    const model = gltf.scene;
    modelRoot = model;
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.set(-center.x, -center.y, -center.z);
    modelCenter = center;
    scene.add(model);
    markersReady();
    const span = Math.max(size.x, size.y, 1);
    const dist = span * 1.4;
    camera.position.set(0, -dist * 0.8, dist * 0.8);
    camera.near = Math.max(span / 1000, 0.01);
    camera.far = span * 50;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
    resize();
  }, undefined, function () {
    fail("The model did not load.");
  });
}

document.getElementById("orthoBtn").addEventListener("click", function () {
  showingOrtho = !showingOrtho;
  orthoView.style.display = showingOrtho ? "block" : "none";
  this.textContent = showingOrtho ? "MODEL" : "ORTHO";
  if (showingOrtho) {
    live = false;
    layoutPins();
    placeOrtho();
    return;
  }
  pinLayer.style.display = "none";
  if (!live) {
    live = true;
    requestAnimationFrame(frame);
  }
});
img.addEventListener("load", function () { layoutPins(); placeOrtho(); });

function frame() {
  if (!live) return;
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
